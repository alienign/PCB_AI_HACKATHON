name: Backend CI

on:
  push:
    branches:
      - integration-test
      - main
      - 'alina/**'
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcb_test
          POSTGRES_PASSWORD: pcb_test_password
          POSTGRES_DB: pcb_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcb_test -d pcb_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://pcb_test:pcb_test_password@localhost:5432/pcb_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://pcb_test:pcb_test_password@localhost:5432/pcb_ai_test
      STORAGE_PATH: ./storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -v tests/